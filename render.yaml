services:
  - type: web
    name: andys-store-backend
    runtime: docker
    repo: https://github.com/AndyShoeSupply/andys-store-backend
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STORE_URL
        value: https://example.com
      - key: STORE_ORIGIN
        value: "*"
      - key: SHIP_FROM_ZIP
        value: "79045"
